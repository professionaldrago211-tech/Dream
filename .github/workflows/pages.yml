name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare FFmpeg worker
        run: |
          cp node_modules/@ffmpeg/ffmpeg/dist/esm/worker.js ./ffmpeg-worker.js
          cp node_modules/@ffmpeg/ffmpeg/dist/esm/const.js ./const.js
          cp node_modules/@ffmpeg/ffmpeg/dist/esm/errors.js ./errors.js
          cp node_modules/@ffmpeg/ffmpeg/dist/esm/utils.js ./utils.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
